name: Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x64
            rid: win-x64
          - platform: ARM64
            rid: win-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Publish (self-contained, no runtime install needed)
        run: >
          dotnet publish src/SoundBridge -c Release -r ${{ matrix.rid }}
          --self-contained true -p:Platform=${{ matrix.platform }} -o out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SoundBridge-${{ matrix.platform }}
          path: out
          retention-days: 30
